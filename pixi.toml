[workspace]
authors = ["tdgfrost <100413067+tdgfrost@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "td-icu-mortality"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
pip = "*"
setuptools = "<82"
wheel = "*"

[target.linux-64.dependencies]
cuda-nvcc = "12.4.*"
cuda-cudart-dev = "12.4.*"
cuda-version = "12.4.*"
gxx_linux-64 = "12.*"

[target.linux-64.pypi-dependencies]
torch = { version = "==2.4.0", index = "https://download.pytorch.org/whl/cu124" }

[target.osx-arm64.pypi-dependencies]
torch = "==2.4.0"

[pypi-dependencies]
h5py = "==3.11.0"
inquirer = "==3.1.4"
numpy = "==2.1.1"
polars = "==1.7.1"
torch = "==2.4.0"
tensorboard = "==2.17.1"
torcheval = "==0.0.7"
tensordict = "==0.5.0"
scipy = ">=1.17.1, <2"
numba = ">=0.65.1, <0.66"
joblib = ">=1.5.3, <2"
tqdm = ">=4.67.3, <5"
matplotlib = ">=3.10.9, <4"
seaborn = ">=0.13.2, <0.14"
line-profiler = ">=5.0.2, <6"
